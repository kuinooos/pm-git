version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./config:/app/config
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8008 --reload
    restart: unless-stopped

  celery-worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./config:/app/config
    command: celery -A src.infrastructure.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    profiles:
      - worker
      - prod

  chainlit:
    build: .
    ports:
      - "8009:8008"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./config:/app/config
      - ./app.py:/app/app.py
      - ./chainlit.md:/app/chainlit.md
    command: chainlit run app.py -w --host 0.0.0.0 --port 8008
    restart: unless-stopped
    profiles:
      - chainlit

volumes:
  redis_data:
